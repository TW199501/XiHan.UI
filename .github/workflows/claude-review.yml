name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    name: review
    # DECIDED EXCEPTION to "every PR is AI-reviewed": bot-authored pull requests
    # are skipped rather than failed (a human reviews their diff). Dependabot's
    # PRs cannot read repository secrets by design, so the token would always
    # arrive empty and every dependency bump would carry a red check for a
    # review that never could have run. A skipped job still satisfies a
    # required status check.
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # Keep GITHUB_TOKEN out of .git/config; the review step gets its own.
          persist-credentials: false

      # Draws on the Claude subscription. Swap to `anthropic_api_key` with an
      # ANTHROPIC_API_KEY secret to bill an API account instead — pass exactly
      # one of the two; passing both only earns a warning for whichever secret
      # does not exist.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use this job's GITHUB_TOKEN so the `permissions` block above bounds
          # what the review can do; without it the action exchanges OIDC for a
          # Claude App token whose rights come from the app installation.
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Reply in Traditional Chinese (Taiwan).
            The repo holds pieces that have to stay in step, so weigh these first:

            - ui/          pnpm + Turborepo component library. Core holds
                           framework-agnostic primitives; Headless holds each
                           component's state machine, defaults, events,
                           keyboard, ARIA, anatomy and `connect`; the Vue,
                           React and Web Components adapters consume the same
                           contract; styles are plain CSS on DTCG tokens.
            - docs/        VitePress site. Props, events, slots, anatomy,
                           keyboard tables, state attributes, CSS variables and
                           the custom elements manifest are generated or
                           checked from source.
            - .github/     CI. Flag any change that weakens a gate: added
                           `continue-on-error`, `paths:` filters on ci.yml,
                           a job missing from the `ci` job's `needs:`, renamed
                           required jobs (`ci`, `review`), relaxed size or
                           public-surface budgets, or removed
                           `--frozen-lockfile`.

            Known pitfalls in this repo — check every PR against them:
            - Shared behaviour implemented inside one adapter drifts from the
              other two. It belongs in Core or Headless; the Vue, React and
              Web Components adapters must expose identical props, events,
              parts and defaults.
            - Generated files (token artifacts, unlayered CSS, the custom
              elements manifest, component docs, the public-surface baseline)
              must be regenerated in the same commit as their source; a hand
              edit of a generated file is overwritten and fails the
              "in sync" gates.
            - Skins must consume semantic tokens only. Raw colour, spacing,
              radius, shadow or duration values, Tailwind utilities and
              CSS-in-JS as the public skin source are not allowed.
            - jsdom cannot verify layout, animation completion, portal
              geometry or computed styles; those need a real Chromium test.
              A visual fix needs a failing assertion added first.
            - Non-bubbling events must use native listeners; framework
              synthetic events are not equivalent.
            - Silent fallbacks and speculative compatibility shims hide real
              bugs and are rejected.

            Then the usual: correctness, security, performance, and whether
            tests cover behaviour that would otherwise regress silently.
            Flag any change to a public API that does not update docs/ and the
            public-surface baseline alongside it.

            Note: The PR branch is already checked out in the current working
            directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The action reports only `is_error: true` and swallows the reason. The
      # full result is written to a file, so print it when something fails —
      # otherwise diagnosing an auth or quota problem is guesswork.
      - name: Show the raw result when the review fails
        if: failure()
        run: cat "$RUNNER_TEMP/claude-execution-output.json" || echo 'no output file'
